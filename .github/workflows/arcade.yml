name: Gerar arcade de contribuições

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/arcade.yml"

permissions:
  contents: write

concurrency:
  group: contribution-arcade
  cancel-in-progress: true

jobs:
  generate:
    name: Gerar e publicar Galaga
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Gerar Galaga para temas claro e escuro
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa
        with:
          github_user_name: Y4nnLS
          games: "galaga"
          hide_month_labels: "false"

      - name: Publicar SVGs na branch output
        uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd # v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
